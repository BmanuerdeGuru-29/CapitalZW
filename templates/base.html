{% load static humanize %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CapitalZW - Turn approved invoices into working capital. Secure digital receivables finance platform.">
    <title>{% block title %}CapitalZW{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    navy: { 800: '#1e293b', 900: '#0f172a' },
                    emerald: { 500: '#10b981', 600: '#059669', 700: '#047857' },
                    teal: { 500: '#14b8a6', 600: '#0d9488' }
                }
            }
        }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0d9488 100%); }
        .glass-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .sidebar-link { transition: all 0.2s; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(16,185,129,0.15); color: #10b981; }
        .kpi-card { transition: transform 0.2s, box-shadow 0.2s; }
        .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .status-badge { padding: 2px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .status-draft { background: #e5e7eb; color: #374151; }
        .status-pending_buyer_approval, .status-pending, .status-submitted { background: #fef3c7; color: #92400e; }
        .status-available_for_financing, .status-approved, .status-approved_by_buyer { background: #d1fae5; color: #065f46; }
        .status-offer_received, .status-offer_accepted { background: #dbeafe; color: #1e40af; }
        .status-settlement_pending { background: #e0e7ff; color: #3730a3; }
        .status-settled, .status-completed, .status-paid, .status-repaid { background: #d1fae5; color: #065f46; }
        .status-rejected, .status-failed, .status-defaulted, .status-cancelled { background: #fee2e2; color: #991b1b; }
        .status-disputed, .status-overdue { background: #fecaca; color: #991b1b; }
        .status-suspended { background: #fee2e2; color: #991b1b; }
        .status-withdrawn, .status-expired { background: #f3f4f6; color: #6b7280; }
        .status-clarification_requested { background: #fff7ed; color: #9a3412; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    {% block body %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
